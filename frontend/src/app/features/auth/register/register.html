<div class="form-page mx-auto py-4">
  <div class="text-center mb-4">
    <div class="d-inline-flex align-items-center justify-content-center rounded-circle bg-primary-subtle mb-3" style="width: 56px; height: 56px;">
      <i class="fa-solid fa-user-plus text-primary fs-4"></i>
    </div>
    <h2 class="mb-0">Create your account</h2>
    <p class="text-body-secondary">It only takes a minute</p>
  </div>

  <div class="card auth-card">
    <div class="card-body p-4">
      <form (ngSubmit)="submit()" #form="ngForm">
        <div class="mb-3">
          <label class="form-label" for="username">Username</label>
          <input
            id="username"
            name="username"
            class="form-control"
            [(ngModel)]="username"
            required
            minlength="3"
          />
        </div>

        <div class="mb-3">
          <label class="form-label" for="password">Password</label>
          <input
            id="password"
            name="password"
            type="password"
            class="form-control"
            [(ngModel)]="password"
            required
            minlength="6"
          />
        </div>

        <div class="mb-3">
          <label class="form-label" for="confirmPassword">Confirm password</label>
          <input
            id="confirmPassword"
            name="confirmPassword"
            type="password"
            class="form-control"
            [(ngModel)]="confirmPassword"
            required
          />
        </div>

        @if (errorMessage()) {
          <div class="alert alert-danger py-2">{{ errorMessage() }}</div>
        }
        @if (successMessage()) {
          <div class="alert alert-success py-2">{{ successMessage() }}</div>
        }

        <button class="btn btn-primary w-100" type="submit" [disabled]="!form.valid || isSubmitting()">
          @if (isSubmitting()) {
            <span class="spinner-border spinner-border-sm me-2"></span>
          }
          Register
        </button>
      </form>
    </div>
  </div>

  <p class="mt-3 text-center">
    Already have an account? <a routerLink="/login">Login here</a>
  </p>
</div>
