<div class="form-page mx-auto">
  <h2 class="mb-4"><i class="fa-solid fa-user-plus me-2"></i>Register</h2>

  <form (ngSubmit)="submit()" #form="ngForm">
    <div class="mb-3">
      <label class="form-label" for="username">Username</label>
      <input
        id="username"
        name="username"
        class="form-control"
        [(ngModel)]="username"
        required
        minlength="3"
      />
    </div>

    <div class="mb-3">
      <label class="form-label" for="password">Password</label>
      <input
        id="password"
        name="password"
        type="password"
        class="form-control"
        [(ngModel)]="password"
        required
        minlength="6"
      />
    </div>

    <div class="mb-3">
      <label class="form-label" for="confirmPassword">Confirm password</label>
      <input
        id="confirmPassword"
        name="confirmPassword"
        type="password"
        class="form-control"
        [(ngModel)]="confirmPassword"
        required
      />
    </div>

    @if (errorMessage()) {
      <div class="alert alert-danger py-2">{{ errorMessage() }}</div>
    }
    @if (successMessage()) {
      <div class="alert alert-success py-2">{{ successMessage() }}</div>
    }

    <button class="btn btn-primary w-100" type="submit" [disabled]="!form.valid || isSubmitting()">
      @if (isSubmitting()) {
        <span class="spinner-border spinner-border-sm me-2"></span>
      }
      Register
    </button>
  </form>

  <p class="mt-3 text-center">
    Already have an account? <a routerLink="/login">Login here</a>
  </p>
</div>
