<div class="form-page mx-auto">
  <h2 class="mb-4"><i class="fa-solid fa-right-to-bracket me-2"></i>Login</h2>

  <form (ngSubmit)="submit()" #form="ngForm">
    <div class="mb-3">
      <label class="form-label" for="username">Username</label>
      <input
        id="username"
        name="username"
        class="form-control"
        [(ngModel)]="username"
        required
      />
    </div>

    <div class="mb-3">
      <label class="form-label" for="password">Password</label>
      <input
        id="password"
        name="password"
        type="password"
        class="form-control"
        [(ngModel)]="password"
        required
      />
    </div>

    @if (errorMessage()) {
      <div class="alert alert-danger py-2">{{ errorMessage() }}</div>
    }

    <button class="btn btn-primary w-100" type="submit" [disabled]="!form.valid || isSubmitting()">
      @if (isSubmitting()) {
        <span class="spinner-border spinner-border-sm me-2"></span>
      }
      Login
    </button>
  </form>

  <p class="mt-3 text-center">
    No account yet? <a routerLink="/register">Register here</a>
  </p>
</div>
