<div class="form-page mx-auto py-4">
  <div class="text-center mb-4">
    <div class="d-inline-flex align-items-center justify-content-center rounded-circle bg-primary-subtle mb-3" style="width: 56px; height: 56px;">
      <i class="fa-solid fa-book-open text-primary fs-4"></i>
    </div>
    <h2 class="mb-0">Welcome back</h2>
    <p class="text-body-secondary">Log in to manage your books and quotes</p>
  </div>

  <div class="card auth-card">
    <div class="card-body p-4">
      <form (ngSubmit)="submit()" #form="ngForm">
        <div class="mb-3">
          <label class="form-label" for="username">Username</label>
          <input
            id="username"
            name="username"
            class="form-control"
            [(ngModel)]="username"
            required
          />
        </div>

        <div class="mb-3">
          <label class="form-label" for="password">Password</label>
          <input
            id="password"
            name="password"
            type="password"
            class="form-control"
            [(ngModel)]="password"
            required
          />
        </div>

        @if (errorMessage()) {
          <div class="alert alert-danger py-2">{{ errorMessage() }}</div>
        }

        <button class="btn btn-primary w-100" type="submit" [disabled]="!form.valid || isSubmitting()">
          @if (isSubmitting()) {
            <span class="spinner-border spinner-border-sm me-2"></span>
          }
          Login
        </button>
      </form>
    </div>
  </div>

  <p class="mt-3 text-center">
    No account yet? <a routerLink="/register">Register here</a>
  </p>
</div>
